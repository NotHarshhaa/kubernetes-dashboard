name: Build and Push to Docker Hub

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target architectures to build (comma-separated)'
        required: false
        default: 'linux/amd64,linux/arm64'
      reason:
        description: 'Reason for manual build'
        required: false
        default: 'Manual Docker image build'
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: docker.io
  IMAGE_NAME: harshhaareddy/kubernetes-dashboard

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.profile }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: alpine
            dockerfile: Dockerfile
            tag_suffix: ''
            is_default: true
          - profile: distroless
            dockerfile: Dockerfile.distroless
            tag_suffix: '-distroless'
            is_default: false
          - profile: chainguard
            dockerfile: Dockerfile.chainguard
            tag_suffix: '-chainguard'
            is_default: false
          - profile: debian
            dockerfile: Dockerfile.debian
            tag_suffix: '-debian'
            is_default: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ matrix.is_default }}
            suffix=${{ matrix.tag_suffix }}
          tags: |
            type=raw,value=${{ matrix.profile }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.profile }}
