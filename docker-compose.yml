services:
  kubernetes-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: kubernetes-dashboard:latest
    container_name: k8s-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_DEMO_MODE=true
    # Optional: Mount your local kubeconfig to interact with a real local cluster
    # volumes:
    #   - ${HOME}/.kube/config:/home/nextjs/.kube/config:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/cluster').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - dashboard-network

networks:
  dashboard-network:
    driver: bridge
